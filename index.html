<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DeepHat | Security Orchestrator</title>
    <style>
        /* Reset e Base */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Courier New', Courier, monospace;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Componentes */
        .panel {
            background: #161616;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #00ffcc;
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        h3 {
            margin-top: 0;
            margin-bottom: 15px;
            color: #00ffcc;
        }

        /* Formulários */
        input[type="text"] {
            width: 100%;
            padding: 12px;
            background: #000;
            border: 1px solid #333;
            color: #e0e0e0;
            font-family: inherit;
            font-size: 1rem;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        input:focus {
            outline: none;
            border-color: #00ffcc;
        }

        button {
            background: #00ffcc;
            color: #000;
            border: none;
            padding: 12px 24px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s;
            font-family: inherit;
        }

        button:hover {
            background: #00cc99;
        }

        button:disabled {
            background: #555;
            cursor: not-allowed;
            opacity: 0.7;
        }

        /* Feedback */
        .log-output {
            background: #000;
            padding: 15px;
            border: 1px solid #333;
            font-size: 0.9rem;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
            word-wrap: break-word;
        }

        /* Artefatos */
        .artifact-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 300px;
            overflow-y: auto;
        }

        .artifact-item {
            background: #000;
            border: 1px solid #333;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .artifact-link {
            color: #00ffcc;
            text-decoration: none;
            font-size: 0.85rem;
            word-break: break-all;
        }

        .artifact-link:hover {
            text-decoration: underline;
        }

        /* Tags de Severidade */
        .tag {
            display: inline-block;
            padding: 2px 8px;
            background: #333;
            border-radius: 4px;
            font-size: 0.8rem;
            margin-right: 5px;
        }

        .severity-HIGH { background: #ff4d4d; color: white; }
        .severity-MEDIUM { background: #ffa500; color: black; }
        .severity-LOW { background: #4d79ff; color: white; }
        .severity-ERROR { background: #555; color: white; }
        .severity-INFO { background: #4d79ff; color: white; }

        /* Loader */
        .loader {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Status Bar */
        .status-bar {
            font-size: 0.8rem;
            color: #888;
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
        }

        /* Grid Principal */
        .main-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

                    <input type="text" id="query-input" placeholder="Ex: Analise esta arquitetura de microserviços para vulnerabilidades de injeção...">

                </div>

            </div>
        </div>
    </div>
